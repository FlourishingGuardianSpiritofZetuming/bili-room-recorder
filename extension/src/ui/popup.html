<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>语聊房记录器</title>
    <style>
      body {
        margin: 0;
        width: 320px;
        font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2329;
      }
      .wrap { padding: 14px 16px; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .sub { color: #6b7280; font-size: 12px; margin-bottom: 12px; }
      .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #eef0f2; }
      .row:last-child { border-bottom: none; }
      .k { color: #6b7280; }
      .v { font-weight: 600; text-align: right; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ok { color: #10b981; }
      .warn { color: #f59e0b; }
      .err { color: #ef4444; }
      .btns { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        font: inherit;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        background: #fff;
        cursor: pointer;
      }
      button.primary { background: #fb7299; border-color: #fb7299; color: #fff; }
      button:hover { filter: brightness(0.98); }
      .tip { margin-top: 10px; color: #6b7280; font-size: 12px; line-height: 1.5; }
      .tip b { color: #ef4444; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>B站语聊房记录器</h1>
      <div class="sub">当前标签页</div>
      <div id="info"></div>
      <div class="btns">
        <button id="toggleBtn">暂停本页</button>
        <button id="openBtn" class="primary">记录面板</button>
      </div>
      <div class="btns">
        <button id="asrBtn">开启本地识别</button>
      </div>
      <div class="btns">
        <button id="recBtn">开始录音</button>
      </div>
      <div id="tip" class="tip"></div>
    </div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
